name: Closed Period Notifications Cron

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: closed-period-notifications-cron
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger notification cron endpoint
        env:
          CLOSED_PERIOD_CRON_SECRET: ${{ secrets.CLOSED_PERIOD_CRON_SECRET }}
          CRON_URL: https://info-room-reservation-site.vercel.app/api/cron/closed-period-notifications
        run: |
          curl --fail --show-error --silent --location \
            --max-time 25 \
            --header "Authorization: Bearer ${CLOSED_PERIOD_CRON_SECRET}" \
            "${CRON_URL}"
