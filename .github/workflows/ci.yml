name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  operational-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:operational:core -- --phase full --ci
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/operational-fomo-browser-evidence
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: operational-fomo-browser-evidence
          path: ${{ runner.temp }}/operational-fomo-browser-evidence
          if-no-files-found: error
